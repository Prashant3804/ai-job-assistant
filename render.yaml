# Blueprint Infrastructure Configuration
# AI Job Assistant: Backend Web Service, Background Worker, and Managed PostgreSQL

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: ai-job-assistant-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-assistant-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MAILBOX_ENCRYPTION_KEY
        generateValue: true
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: "https://yourdomain.com,https://app.yourdomain.com"

  # 2. Asynchronous Background Worker
  - type: worker
    name: ai-job-assistant-worker
    env: docker
    dockerfilePath: Dockerfile.worker
    dockerContext: backend
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-assistant-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-job-assistant-backend
          envVarKey: SECRET_KEY
      - key: MAILBOX_ENCRYPTION_KEY
        fromService:
          type: web
          name: ai-job-assistant-backend
          envVarKey: MAILBOX_ENCRYPTION_KEY
      - key: OMNIROUTE_API_KEY
        sync: false

databases:
  # 3. Managed PostgreSQL Database with pgvector
  - name: ai-job-assistant-db
    databaseName: job_assistant_prod
    user: job_assistant_user
    plan: standard
    postgresMajorVersion: 16
